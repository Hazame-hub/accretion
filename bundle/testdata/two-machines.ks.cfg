# Written by accrete. One answer file for 2 machine(s): db-01, web-01.
# The machine selects its profile in %pre from its SMBIOS UUID, serial
# number or MAC addresses. An unknown or ambiguous machine stops here,
# before any disk is partitioned.
%pre --erroronfail --log=/tmp/accrete-pre.log
dmi="${ACCRETE_DMI:-/sys/class/dmi/id}"
net="${ACCRETE_NET:-/sys/class/net}"
out="${ACCRETE_OUT:-/tmp/accrete-machine.ks}"
uuid=$(tr 'A-F' 'a-f' < "$dmi/product_uuid" 2>/dev/null | tr -d '[:space:]')
serial=$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$dmi/product_serial" 2>/dev/null)
macs=$(cat "$net"/*/address 2>/dev/null | tr 'A-F' 'a-f' | sort -u | tr '\n' ' ')
decode='import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
match=""
hit() { case " $match " in *" $1 "*) ;; *) match="${match:+$match }$1" ;; esac; }
# db-01
[ "$uuid" = '4c4c4544-0042-3510-8051-b4c04f4e4d32' ] && hit db-01
[ "$uuid" = '44454c4c-4200-1035-8051-b4c04f4e4d32' ] && hit db-01
# web-01
[ "$serial" = 'CZJ1234ABC' ] && hit web-01
case " $macs " in *' 52:54:00:aa:00:01 '*) hit web-01 ;; esac
if [ -z "$match" ]; then
  echo "accrete: this machine matches no profile (uuid=$uuid serial=$serial macs=$macs); expected one of: db-01, web-01. Nothing was installed." >&2
  exit 1
fi
case "$match" in *' '*)
  echo "accrete: this machine matches more than one profile ($match; uuid=$uuid serial=$serial macs=$macs). Nothing was installed." >&2
  exit 1 ;;
esac
echo "accrete: installing profile $match (uuid=$uuid serial=$serial)" >&2
case "$match" in
db-01)
  python3 -c "$decode" > "$out" <<'ACCRETE_PROFILE'
bmV0d29yayAtLWhvc3RuYW1lPWRiLTAxCnJvb3RwdyAtLWxvY2sK
ACCRETE_PROFILE
  ;;
web-01)
  python3 -c "$decode" > "$out" <<'ACCRETE_PROFILE'
bmV0d29yayAtLWhvc3RuYW1lPXdlYi0wMQpyb290cHcgLS1sb2NrCiVwYWNrYWdlcwpAXm1pbmlt
YWwtZW52aXJvbm1lbnQKJWVuZAo=
ACCRETE_PROFILE
  ;;
esac
%end
%include /tmp/accrete-machine.ks
