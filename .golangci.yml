# golangci-lint v2. CI runs it with --new-from-rev=origin/main, so only issues
# a pull request introduces fail the build; what main already carries is left
# for whoever next touches that code. The linter set is the standard one
# (errcheck, govet, ineffassign, staticcheck, unused) and nothing more, so a
# finding here is a real defect rather than a style preference.
version: "2"

linters:
  default: standard

run:
  timeout: 10m
