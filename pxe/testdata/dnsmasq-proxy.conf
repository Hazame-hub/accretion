# Written by accrete. Proxy DHCP for network installs on 192.168.1.0/24.
# It assigns no address: the network's own DHCP server keeps doing that.
port=0
dhcp-range=192.168.1.0,proxy,255.255.255.0
log-dhcp
enable-tftp
tftp-root=/srv/tftp
# iPXE says so in option 175; until then, hand out the iPXE loader.
dhcp-match=set:ipxe,175
pxe-prompt="accrete",0
pxe-service=tag:!ipxe,x86PC,"accrete: load iPXE",undionly.kpxe
pxe-service=tag:!ipxe,X86-64_EFI,"accrete: load iPXE",ipxe.efi
pxe-service=tag:ipxe,x86PC,"accrete: gate",http://192.168.1.45:8088/gate.ipxe
pxe-service=tag:ipxe,X86-64_EFI,"accrete: gate",http://192.168.1.45:8088/gate.ipxe
