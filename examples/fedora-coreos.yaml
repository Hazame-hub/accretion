# A Fedora CoreOS VM on Proxmox, built from its proxmoxve image with an
# Ignition config accrete renders from the bootstrap below:
#
#   ACCRETE_PROXMOX_TOKEN='user@realm!tokenid=secret' \
#     go run ./cmd/accrete apply -f examples/fedora-coreos.yaml
#
# apply fetches the image itself when the storage does not have it:
# downloaded here, checked against image_sha256, decompressed, uploaded.
# `accrete image fedora-coreos` prints the image lines for the current
# stable release. Once, in Proxmox VE 8.2 or later, let the storage hold
# disk images: Datacenter → Storage → local → Edit → Content: add Import.
apiVersion: accretion/v1alpha1
kind: Environment
metadata:
  name: fcos
spec:
  provider:
    type: proxmox
    endpoint: https://pve.example.invalid:8006
    verify_tls: false
    token_env: ACCRETE_PROXMOX_TOKEN
  resources:
    - name: fcos
      count: 1
      blueprint: image-proxmox-vm
      inputs:
        pve_node: pve
        hostname: fcos-{{instance.number}}
        # From `accrete image fedora-coreos`; run it again for the current
        # release. A hash that does not match only stops the upload.
        image: local:import/fedora-coreos-44.20261023.3.1-proxmoxve.x86_64.qcow2
        image_url: https://builds.coreos.fedoraproject.org/prod/streams/stable/builds/44.20261023.3.1/x86_64/fedora-coreos-44.20261023.3.1-proxmoxve.x86_64.qcow2.xz
        image_sha256: 8182e2b95824b4e6c42eaaab791685bbfcb1b704fe55758aeff0a2a14a319648
        seed_format: ignition
        disk_gb: 20
        cores: 2
        memory_mb: 4096
        net0: virtio,bridge=vmbr0
        bootstrap:
          users:
            # core is Fedora CoreOS's own admin; give it your key.
            - name: core
              ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGbm9wZW5zc2gta2V5LXYxAAAAAA you@laptop"]
              sudo: true
          timezone: Europe/Rome
          files:
            - path: /etc/motd.d/accrete
              content: "Built by accrete from the Fedora CoreOS proxmoxve image.\n"
